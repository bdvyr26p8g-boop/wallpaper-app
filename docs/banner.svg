  <rect y="250" width="1280" height="70" fill="url(#lake)"/>
  <rect y="252" width="1280" height="2" fill="#9fe0f2" opacity="0.55"/>
  <ellipse cx="1046" cy="272" rx="72" ry="10" fill="#ffd166" opacity="0.22"/>

  <!-- 标题 -->
  <text x="80" y="122" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="54" font-weight="700" fill="#ffffff">免费壁纸 · WallpaperApp</text>
  <text x="82" y="168" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#bfe3ee">免费开源 · 无需 API Key · 实时抓取公开图源美图 · 一键设壁纸</text>

