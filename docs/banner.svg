    <rect x="82" y="196" width="86" height="28" rx="14" fill="#ffffff" opacity="0.14"/>
    <text x="125" y="215" text-anchor="middle">Bing</text>

    <rect x="178" y="196" width="120" height="28" rx="14" fill="#ffffff" opacity="0.14"/>
    <text x="238" y="215" text-anchor="middle">Wikimedia</text>

    <rect x="308" y="196" width="110" height="28" rx="14" fill="#ffffff" opacity="0.14"/>
    <text x="363" y="215" text-anchor="middle">Openverse</text>

    <rect x="428" y="196" width="100" height="28" rx="14" fill="#ffffff" opacity="0.14"/>
    <text x="478" y="215" text-anchor="middle">Picsum</text>
