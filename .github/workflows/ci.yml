name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Syntax & import check (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.8", "3.12" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Byte-compile all modules
        run: python -m py_compile sources.py wallpaper_core.py app.py

      - name: Import check (no GUI loop)
        run: python -c "import sources, wallpaper_core, app; print('imports OK')"

      - name: Validate SVG assets are well-formed XML
        run: python -c "import glob, xml.dom.minidom as m; [m.parse(f) for f in glob.glob('docs/*.svg')]; print('SVG OK')"
